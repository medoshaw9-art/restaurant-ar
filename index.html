<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Restaurant AR</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin-top: 30px;
    }

    model-viewer {
      width: 100%;
      height: 500px;
      background: white;
    }

    button {
      padding: 15px 25px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #000;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>🍔 Burger AR</h1>

  <model-viewer
    src="burger.glb"
    alt="3D Burger"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    shadow-intensity="1"
    environment-image="neutral">

    <button slot="ar-button">
      View in AR
    </button>

  </model-viewer>

</body>
</html>
